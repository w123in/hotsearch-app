<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6C5CE7">
<title>热搜追踪 · 灵感盒子</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #0F0E17; color: #F5F5F7; min-height: 100vh; font-size: 14px; padding-bottom: 70px;
}
.header {
  background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
  padding: 20px 16px 14px; position: sticky; top: 0; z-index: 100;
}
.header h1 { font-size: 18px; font-weight: 700; color: #fff; }
.header .sub { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 4px; }
.refresh-btn {
  position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.2); border: none; color: #fff;
  width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer;
}
.tabs { display: flex; gap: 0; padding: 0; background: #1A1B2E; overflow-x: auto; }
.tabs button {
  flex: 1; min-width: 60px; padding: 10px 4px; border: none; background: none;
  color: #8899A6; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
  white-space: nowrap;
}
.tabs button.active { color: #6C5CE7; border-bottom-color: #6C5CE7; font-weight: 600; }
.filters { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.filter-select {
  background: #1A1B2E; color: #F5F5F7; border: 1px solid #2D2E44;
  padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;
}
.list { padding: 8px 12px; }
.item {
  background: #1A1B2E; border-radius: 12px; padding: 12px; margin-bottom: 8px;
  display: flex; gap: 10px; align-items: flex-start;
}
.item:hover { background: #252640; }
.rank {
  width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center;
  justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.rank-1 { background: #FF4757; color: #fff; }
.rank-2 { background: #FF6B81; color: #fff; }
.rank-3 { background: #FFA502; color: #fff; }
.rank-other { background: #2D2E44; color: #8899A6; }
.item-content { flex: 1; min-width: 0; }
.item-title { font-size: 14px; font-weight: 500; line-height: 1.4; color: #F5F5F7; }
.item-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag {
  font-size: 11px; padding: 2px 8px; border-radius: 6px;
  background: #2D2E44; color: #8899A6;
}
.tag-platform { color: #fff; }
.tag-domain { background: #6C5CE7; color: #fff; }
.tag-hot { background: #FF4757; color: #fff; }
.item-link {
  font-size: 12px; color: #6C5CE7; text-decoration: none; margin-top: 4px; display: inline-block;
}
.empty { text-align: center; padding: 40px 20px; color: #555; font-size: 14px; }
.loading { text-align: center; padding: 40px 20px; color: #888; }
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid #2D2E44; border-top-color: #6C5CE7;
  border-radius: 50%; margin: 0 auto 12px; animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; background: #1A1B2E;
  display: flex; border-top: 1px solid #2D2E44; z-index: 100;
}
.bottom-nav button {
  flex: 1; padding: 10px 0; border: none; background: none; color: #555;
  font-size: 12px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 2px;
}
.bottom-nav button.active { color: #6C5CE7; }
.bottom-nav .icon { font-size: 18px; }

/* Keyword page */
.kw-section { padding: 12px; }
.kw-section h3 { font-size: 14px; color: #8899A6; margin-bottom: 8px; }
.kw-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.kw-tag {
  background: #2D2E44; color: #F5F5F7; padding: 4px 10px; border-radius: 8px;
  font-size: 12px; display: flex; align-items: center; gap: 4px;
}
.kw-tag .del { color: #FF4757; cursor: pointer; font-size: 14px; line-height: 1; }
.kw-add { display: flex; gap: 6px; margin-bottom: 16px; }
.kw-add input {
  flex: 1; background: #1A1B2E; border: 1px solid #2D2E44; color: #F5F5F7;
  padding: 6px 10px; border-radius: 8px; font-size: 12px;
}
.kw-add button {
  background: #6C5CE7; color: #fff; border: none; padding: 6px 14px;
  border-radius: 8px; font-size: 12px; cursor: pointer;
}
.domain-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.domain-tab {
  padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
  background: #1A1B2E; color: #8899A6; border: 1px solid #2D2E44;
}
.domain-tab.active { background: #6C5CE7; color: #fff; }
.domain-tab .del { color: rgba(255,255,255,0.6); margin-left: 4px; }
.history-item { background: #1A1B2E; padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; color: #8899A6; }
.history-item .count { color: #6C5CE7; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <h1>热搜追踪</h1>
  <div class="sub" id="lastUpdate">加载中...</div>
  <button class="refresh-btn" id="refreshBtn" title="刷新">↻</button>
</div>

<div class="tabs" id="domainTabs"></div>

<div class="filters">
  <select class="filter-select" id="platformFilter">
    <option value="">全部平台</option>
  </select>
  <select class="filter-select" id="sortFilter">
    <option value="relevance">关联度优先</option>
    <option value="hot">热度优先</option>
    <option value="time">最新优先</option>
  </select>
  <select class="filter-select" id="timeFilter">
    <option value="0">全部时间</option>
    <option value="1">今天</option>
    <option value="2">昨天</option>
    <option value="3">近3天</option>
    <option value="7">近7天</option>
  </select>
</div>

<div id="pageContent">
  <div class="list" id="hotList">
    <div class="loading"><div class="spinner"></div>正在抓取热搜数据...</div>
  </div>
</div>

<div class="bottom-nav">
  <button id="navHot" class="active"><span class="icon">🔥</span><span>热搜</span></button>
  <button id="navHistory"><span class="icon">📅</span><span>历史</span></button>
  <button id="navKeywords"><span class="icon">🏷️</span><span>关键词</span></button>
</div>

<script>
// ===== Config =====
const TOPHUB_BASE = 'https://tophub.today';
const CORS_PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://corsproxy.io/?url=',
  'https://api.codetabs.com/v1/proxy/?quest='
];
const STORAGE_KEY = 'hotsearch_data';
const HISTORY_KEY = 'hotsearch_history';
const KEYWORDS_KEY = 'hotsearch_keywords';
const HISTORY_DAYS = 7;

const PLATFORMS = {
  weibo: { name: '微博', nodeId: 'KqndgxeLl9', color: '#E6162D' },
  douyin: { name: '抖音', nodeId: 'DpQvNABoNE', color: '#000000' },
  zhihu: { name: '知乎', nodeId: 'mproPpoq6O', color: '#0066FF' },
  baidu: { name: '百度', nodeId: 'Jb0vmloB1G', color: '#2932E1' },
  bilibili: { name: 'B站', nodeId: '74KvxwokxM', color: '#FB7299' }
};

const DEFAULT_KEYWORDS = {
  '教育': ['教育','学校','老师','学生','学习','高考','中考','考研','大学','专业','课程','成绩','补课','教培','双减','作业','考试','留学','申请','名校','录取','志愿','报考','学霸','学区房','课外班'],
  '认知': ['认知','思维','思考','底层逻辑','成长','提升','学习方法','效率','思维方式','认知升级','觉醒','开悟','格局','眼界','圈层','信息差','认知差'],
  '家庭': ['家庭','家长','父母','亲子','育儿','孩子','妈妈','爸爸','婚姻','夫妻','家庭关系','家庭教育','青春期','婆媳','带娃','鸡娃','陪读','全职妈妈','宝妈'],
  '升学': ['升学','志愿','报考','录取','高考志愿','专业选择','留学','出国','名校','985','211','考研','考公','就业','offer','保研','春招','秋招','选调'],
  '艺术': ['艺术','美术','音乐','设计','文化','传统','非遗','博物馆','展览','艺术家','画作','书法','国画','油画','雕塑','摄影','电影','戏剧','艺术展','艺术留学'],
  '美学': ['美学','审美','美','文艺','人文','文学','哲学','人生','生活方式','品味','气质','优雅','艺术感','审美提升','生活美学']
};

const DEFAULT_EXCLUDE = [
  '搞笑','段子','整活','表情包','梗','爆笑','沙雕','鬼畜','恶搞',
  '游戏','王者荣耀','英雄联盟','原神','吃鸡','主播','网红',
  '明星','八卦','绯闻','吃瓜','恋情',
  '美食','吃播','探店','旅游','穿搭','美妆',
  'cos','cosplay','漫展','二次元',
  '宠物','萌宠',
  '体育','足球','篮球','世界杯','奥运会'
];

// ===== State =====
let allItems = [];
let currentDomain = '';
let currentPlatform = '';
let currentSort = 'relevance';
let currentTime = 0;
let currentNav = 'hot';

// ===== Storage =====
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const data = JSON.parse(raw); if (data && Array.isArray(data)) return data; }
  } catch(e) {}
  return [];
}
function saveData(items) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    if (raw) { const data = JSON.parse(raw); if (data && Array.isArray(data)) return data; }
  } catch(e) {}
  return [];
}
function saveHistory(history) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
}
function loadKeywords() {
  try {
    const raw = localStorage.getItem(KEYWORDS_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data && data.keywords) return data;
    }
  } catch(e) {}
  return { keywords: JSON.parse(JSON.stringify(DEFAULT_KEYWORDS)), exclude: [...DEFAULT_EXCLUDE] };
}
function saveKeywords(data) {
  try { localStorage.setItem(KEYWORDS_KEY, JSON.stringify(data)); } catch(e) {}
}

// ===== Fetch =====
async function fetchViaProxy(url) {
  for (const proxy of CORS_PROXIES) {
    try {
      const proxyUrl = proxy + encodeURIComponent(url);
      const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
      if (resp.ok) {
        const text = await resp.text();
        if (text && text.length > 100) return text;
      }
    } catch(e) { continue; }
  }
  return null;
}

async function fetchPlatform(platformKey) {
  const platform = PLATFORMS[platformKey];
  if (!platform) return [];
  const url = TOPHUB_BASE + '/n/' + platform.nodeId;
  const html = await fetchViaProxy(url);
  if (!html) return [];
  return parseHotList(html, platform.name, platform.color, platformKey);
}

function parseHotList(html, platformName, color, platformKey) {
  const items = [];
  const m = html.match(/<tbody[^>]*>([\s\S]*?)<\/tbody>/);
  if (!m) return items;
  const tbody = m[1];
  const trRegex = /<tr[^>]*>([\s\S]*?)<\/tr>/g;
  let match;
  while ((match = trRegex.exec(tbody)) !== null) {
    const tr = match[1];
    const rankMatch = tr.match(/<td[^>]*>\s*(\d+)\.\s*<\/td>/);
    if (!rankMatch) continue;
    const rank = parseInt(rankMatch[1]);
    const linkRegex = /<a[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/g;
    let title = '', url = '', lm;
    while ((lm = linkRegex.exec(tr)) !== null) {
      const t = lm[2].replace(/<[^>]*>/g, '').trim();
      if (t.length > 4 && !lm[1].includes('#') && !lm[2].includes('m-n')) {
        title = t; url = lm[1]; break;
      }
    }
    if (!title || title.length < 3) continue;
    let hot = '';
    const wsMatch = tr.match(/class="ws"[^>]*>\s*([^<]+?)\s*<\//);
    if (wsMatch) hot = wsMatch[1].trim();
    else {
      const em = tr.match(/class="item-extra"[^>]*>\s*([^<]+?)\s*<\//);
      if (em) hot = em[1].trim();
    }
    items.push({ rank, title, url, hot, platform: platformName, platformKey, color });
    if (items.length >= 50) break;
  }
  return items;
}

function analyzeTopic(title, keywords, exclude) {
  const domains = [], matched = [];
  const excluded = exclude.some(kw => title.includes(kw));
  if (excluded) return { domains, matchedKeywords: matched, relevance: 0, excluded: true };
  for (const [domain, kws] of Object.entries(keywords)) {
    for (const kw of kws) {
      if (title.includes(kw)) {
        if (!domains.includes(domain)) domains.push(domain);
        matched.push(kw);
      }
    }
  }
  return { domains, matchedKeywords: matched, relevance: matched.length, excluded: false };
}

async function fetchAllHotSearch() {
  const kwData = loadKeywords();
  const now = Date.now();
  const allNewItems = [];

  for (const key of Object.keys(PLATFORMS)) {
    const items = await fetchPlatform(key);
    allNewItems.push(...items);
    await new Promise(r => setTimeout(r, 300));
  }

  const oldItems = loadData();
  const itemMap = new Map();
  oldItems.forEach(item => itemMap.set(item.platform + '_' + item.title, item));

  let newCount = 0;
  for (const item of allNewItems) {
    const analysis = analyzeTopic(item.title, kwData.keywords, kwData.exclude);
    if (analysis.excluded) continue;
    const id = item.platform + '_' + item.title;
    if (!itemMap.has(id)) {
      itemMap.set(id, {
        ...item,
        domains: analysis.domains,
        matchedKeywords: analysis.matchedKeywords,
        relevance: analysis.relevance,
        firstSeen: now,
        lastSeen: now
      });
      newCount++;
    } else {
      const old = itemMap.get(id);
      old.rank = item.rank;
      old.hot = item.hot;
      old.lastSeen = now;
    }
  }

  const cutoff = now - HISTORY_DAYS * 24 * 60 * 60 * 1000;
  const freshItems = [...itemMap.values()]
    .filter(item => (item.lastSeen || 0) > cutoff)
    .sort((a, b) => (b.relevance || 0) - (a.relevance || 0));

  saveData(freshItems);

  const history = loadHistory();
  history.unshift({
    timestamp: now,
    dateStr: new Date(now).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' }),
    count: freshItems.length,
    newCount: newCount,
    relevantCount: freshItems.filter(i => i.relevance > 0).length
  });
  if (history.length > 50) history.length = 50;
  saveHistory(history);

  allItems = freshItems;
  return { total: freshItems.length, newCount, relevant: freshItems.filter(i => i.relevance > 0).length };
}

// ===== Render =====
function renderDomainTabs() {
  const kwData = loadKeywords();
  const tabs = document.getElementById('domainTabs');
  let html = '<button class="' + (currentDomain === '' ? 'active' : '') + '" data-domain="">全部</button>';
  for (const domain of Object.keys(kwData.keywords)) {
    html += '<button class="' + (currentDomain === domain ? 'active' : '') + '" data-domain="' + domain + '">' + domain + '</button>';
  }
  tabs.innerHTML = html;
  tabs.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => { currentDomain = btn.dataset.domain; renderDomainTabs(); renderList(); });
  });
}

function renderPlatformFilter() {
  const select = document.getElementById('platformFilter');
  let html = '<option value="">全部平台</option>';
  for (const key of Object.keys(PLATFORMS)) {
    html += '<option value="' + key + '">' + PLATFORMS[key].name + '</option>';
  }
  select.innerHTML = html;
}

function parseHotValue(hotStr) {
  if (!hotStr) return 0;
  const num = parseFloat(hotStr.replace(/[^\d.]/g, ''));
  if (isNaN(num)) return 0;
  if (hotStr.includes('万')) return num * 10000;
  if (hotStr.includes('亿')) return num * 100000000;
  return num;
}

function renderList() {
  const list = document.getElementById('hotList');
  let items = [...allItems];

  if (currentDomain) {
    items = items.filter(item => item.domains && item.domains.includes(currentDomain));
  }
  if (currentPlatform) {
    items = items.filter(item => item.platformKey === currentPlatform);
  }

  const now = Date.now();
  if (currentTime > 0) {
    const cutoff = now - currentTime * 24 * 60 * 60 * 1000;
    items = items.filter(item => (item.firstSeen || 0) > cutoff);
  }

  if (currentSort === 'relevance') {
    items.sort((a, b) => (b.relevance || 0) - (a.relevance || 0));
  } else if (currentSort === 'hot') {
    items.sort((a, b) => parseHotValue(b.hot) - parseHotValue(a.hot));
  } else if (currentSort === 'time') {
    items.sort((a, b) => (b.firstSeen || 0) - (a.firstSeen || 0));
  }

  if (items.length === 0) {
    list.innerHTML = '<div class="empty">暂无数据，点击右上角刷新按钮抓取最新热搜</div>';
    return;
  }

  let html = '';
  for (const item of items) {
    const rankClass = item.rank <= 3 ? 'rank-' + item.rank : 'rank-other';
    let metaHtml = '';
    metaHtml += '<span class="tag tag-platform" style="background:' + (item.color || '#333') + '">' + item.platform + '</span>';
    if (item.hot) metaHtml += '<span class="tag tag-hot">' + item.hot + '</span>';
    if (item.domains && item.domains.length > 0) {
      for (const d of item.domains) {
        metaHtml += '<span class="tag tag-domain">' + d + '</span>';
      }
    }
    if (item.matchedKeywords && item.matchedKeywords.length > 0) {
      for (const kw of item.matchedKeywords.slice(0, 3)) {
        metaHtml += '<span class="tag">' + kw + '</span>';
      }
    }

    let firstSeenStr = '';
    if (item.firstSeen) {
      const d = new Date(item.firstSeen);
      firstSeenStr = (d.getMonth()+1) + '/' + d.getDate();
    }

    html += '<div class="item">';
    html += '<div class="rank ' + rankClass + '">' + item.rank + '</div>';
    html += '<div class="item-content">';
    html += '<div class="item-title">' + item.title + '</div>';
    html += '<div class="item-meta">' + metaHtml + '</div>';
    if (item.url && item.url !== '#') {
      html += '<a class="item-link" href="' + item.url + '" target="_blank">查看原文</a>';
    }
    if (firstSeenStr) html += ' <span class="tag">' + firstSeenStr + '收录</span>';
    html += '</div></div>';
  }
  list.innerHTML = html;
}

function renderHistory() {
  const history = loadHistory();
  const list = document.getElementById('pageContent');
  if (history.length === 0) {
    list.innerHTML = '<div class="empty">暂无历史记录</div>';
    return;
  }
  let html = '<div class="list">';
  for (const h of history) {
    html += '<div class="history-item">';
    html += '<span>' + h.dateStr + '</span> ';
    html += '<span class="count">共' + h.count + '条</span> ';
    if (h.newCount) html += '<span class="count">新增' + h.newCount + '条</span> ';
    html += '<span>相关' + h.relevantCount + '条</span>';
    html += '</div>';
  }
  html += '</div>';
  list.innerHTML = html;
}

function renderKeywords() {
  const kwData = loadKeywords();
  const list = document.getElementById('pageContent');
  let html = '<div class="kw-section">';
  html += '<h3>赛道管理</h3>';
  html += '<div class="domain-tabs" id="domainTabs2">';
  for (const domain of Object.keys(kwData.keywords)) {
    html += '<span class="domain-tab active" data-domain="' + domain + '">' + domain + '<span class="del" data-del-domain="' + domain + '">×</span></span>';
  }
  html += '</div>';
  html += '<div class="kw-add"><input type="text" id="newDomainInput" placeholder="新赛道名称"><button id="addDomainBtn">添加赛道</button></div>';

  html += '<div id="domainKeywordsSection">';
  const firstDomain = Object.keys(kwData.keywords)[0] || '';
  if (firstDomain) {
    html += renderDomainKeywords(firstDomain, kwData);
  }
  html += '</div>';

  html += '<h3>排除词</h3>';
  html += '<div class="kw-tags" id="excludeTags">';
  for (const ex of kwData.exclude) {
    html += '<span class="kw-tag">' + ex + '<span class="del" data-del-exclude="' + ex + '">×</span></span>';
  }
  html += '</div>';
  html += '<div class="kw-add"><input type="text" id="newExcludeInput" placeholder="添加排除词"><button id="addExcludeBtn">添加</button></div>';
  html += '</div>';
  list.innerHTML = html;

  document.getElementById('addDomainBtn').addEventListener('click', () => {
    const input = document.getElementById('newDomainInput');
    const val = input.value.trim();
    if (val && !kwData.keywords[val]) {
      kwData.keywords[val] = [];
      saveKeywords(kwData);
      renderKeywords();
      renderDomainTabs();
    }
  });

  list.querySelectorAll('[data-del-domain]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const domain = el.dataset.delDomain;
      delete kwData.keywords[domain];
      saveKeywords(kwData);
      renderKeywords();
      renderDomainTabs();
    });
  });

  list.querySelectorAll('.domain-tab').forEach(el => {
    el.addEventListener('click', () => {
      const domain = el.dataset.domain;
      document.getElementById('domainKeywordsSection').innerHTML = renderDomainKeywords(domain, kwData);
      bindKeywordEvents(kwData);
    });
  });

  document.getElementById('addExcludeBtn').addEventListener('click', () => {
    const input = document.getElementById('newExcludeInput');
    const val = input.value.trim();
    if (val && !kwData.exclude.includes(val)) {
      kwData.exclude.push(val);
      saveKeywords(kwData);
      renderKeywords();
    }
  });

  list.querySelectorAll('[data-del-exclude]').forEach(el => {
    el.addEventListener('click', () => {
      const ex = el.dataset.delExclude;
      kwData.exclude = kwData.exclude.filter(x => x !== ex);
      saveKeywords(kwData);
      renderKeywords();
    });
  });

  bindKeywordEvents(kwData);
}

function renderDomainKeywords(domain, kwData) {
  let html = '<h3>「' + domain + '」关键词</h3>';
  html += '<div class="kw-tags">';
  for (const kw of kwData.keywords[domain]) {
    html += '<span class="kw-tag">' + kw + '<span class="del" data-del-kw="' + kw + '" data-domain="' + domain + '">×</span></span>';
  }
  html += '</div>';
  html += '<div class="kw-add"><input type="text" id="newKwInput" placeholder="添加关键词" data-domain="' + domain + '"><button id="addKwBtn" data-domain="' + domain + '">添加</button></div>';
  return html;
}

function bindKeywordEvents(kwData) {
  const addBtn = document.getElementById('addKwBtn');
  if (addBtn) {
    addBtn.addEventListener('click', () => {
      const input = document.getElementById('newKwInput');
      const domain = addBtn.dataset.domain;
      const val = input.value.trim();
      if (val && !kwData.keywords[domain].includes(val)) {
        kwData.keywords[domain].push(val);
        saveKeywords(kwData);
        renderKeywords();
      }
    });
  }
  document.querySelectorAll('[data-del-kw]').forEach(el => {
    el.addEventListener('click', () => {
      const domain = el.dataset.domain;
      const kw = el.dataset.delKw;
      kwData.keywords[domain] = kwData.keywords[domain].filter(x => x !== kw);
      saveKeywords(kwData);
      renderKeywords();
    });
  });
}

function switchNav(nav) {
  currentNav = nav;
  document.querySelectorAll('.bottom-nav button').forEach(btn => btn.classList.remove('active'));
  document.getElementById('nav' + nav.charAt(0).toUpperCase() + nav.slice(1)).classList.add('active');

  const tabs = document.getElementById('domainTabs');
  const filters = document.querySelector('.filters');

  if (nav === 'hot') {
    tabs.style.display = 'flex';
    filters.style.display = 'flex';
    renderList();
  } else if (nav === 'history') {
    tabs.style.display = 'none';
    filters.style.display = 'none';
    renderHistory();
  } else if (nav === 'keywords') {
    tabs.style.display = 'none';
    filters.style.display = 'none';
    renderKeywords();
  }
}

async function doRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.style.animation = 'spin 0.8s linear infinite';
  const list = document.getElementById('hotList');
  if (currentNav === 'hot') {
    list.innerHTML = '<div class="loading"><div class="spinner"></div>正在抓取5个平台热搜数据，约10秒...</div>';
  }
  try {
    const result = await fetchAllHotSearch();
    document.getElementById('lastUpdate').textContent =
      '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) +
      ' | 共' + result.total + '条，相关' + result.relevant + '条';
    if (currentNav === 'hot') renderList();
  } catch(e) {
    if (currentNav === 'hot') {
      list.innerHTML = '<div class="empty">抓取失败，请稍后重试。错误：' + e.message + '</div>';
    }
  } finally {
    btn.style.animation = '';
  }
}

// ===== Init =====
allItems = loadData();
renderPlatformFilter();
renderDomainTabs();

document.getElementById('refreshBtn').addEventListener('click', doRefresh);
document.getElementById('platformFilter').addEventListener('change', (e) => { currentPlatform = e.target.value; renderList(); });
document.getElementById('sortFilter').addEventListener('change', (e) => { currentSort = e.target.value; renderList(); });
document.getElementById('timeFilter').addEventListener('change', (e) => { currentTime = parseInt(e.target.value); renderList(); });

document.getElementById('navHot').addEventListener('click', () => switchNav('hot'));
document.getElementById('navHistory').addEventListener('click', () => switchNav('history'));
document.getElementById('navKeywords').addEventListener('click', () => switchNav('keywords'));

if (allItems.length > 0) {
  document.getElementById('lastUpdate').textContent = '本地缓存 ' + allItems.length + ' 条';
  renderList();
} else {
  doRefresh();
}
</script>
</body>
</html>
