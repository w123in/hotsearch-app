<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6C5CE7">
<title>🔥 热搜追踪 · 灵感盒子</title>
<script src="data.js"></script>
<script src="keywords.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #0F0E17;
  color: #F5F5F7;
  min-height: 100vh;
  font-size: 14px;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
  padding: 20px 16px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.header .subtitle { font-size: 12px; opacity: 0.85; margin-bottom: 12px; }
.header .time { font-size: 11px; opacity: 0.75; }

/* Tab Bar */
.tab-bar {
  display: flex;
  background: #1A1925;
  border-bottom: 1px solid #252336;
  position: sticky;
  top: 76px;
  z-index: 99;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.tab-bar::-webkit-scrollbar { display: none; }
.tab-chip {
  flex: 0 0 auto;
  padding: 10px 16px;
  font-size: 13px;
  color: #888;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}
.tab-chip.active { color: #A29BFE; border-bottom-color: #6C5CE7; font-weight: 600; }

/* Platform Filter */
.platform-filter {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.platform-filter::-webkit-scrollbar { display: none; }
.platform-chip {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  background: #252336;
  color: #ccc;
  border: 1px solid transparent;
  cursor: pointer;
}
.platform-chip.active { background: rgba(108, 92, 231, 0.2); color: #A29BFE; border-color: #6C5CE7; }

/* Hot List */
.hot-list { padding: 0 16px; }
.hot-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #1A1925;
  text-decoration: none;
  color: inherit;
}
.hot-item:active { background: #1A1925; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
.hot-rank {
  flex: 0 0 24px;
  height: 24px;
  border-radius: 6px;
  background: #252336;
  color: #888;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hot-rank.top1 { background: #FF4757; color: white; }
.hot-rank.top2 { background: #FF7F50; color: white; }
.hot-rank.top3 { background: #FFA502; color: white; }
.hot-content { flex: 1; min-width: 0; }
.hot-title {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 6px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.hot-meta { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #888; }
.hot-platform { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500; }
.hot-domains { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.hot-domain-tag { padding: 1px 6px; border-radius: 4px; font-size: 10px; background: rgba(108, 92, 231, 0.15); color: #A29BFE; }

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1A1925;
  border-top: 1px solid #252336;
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 0;
  gap: 2px;
  font-size: 10px;
  color: #888;
  cursor: pointer;
}
.nav-item.active { color: #A29BFE; }
.nav-icon { font-size: 20px; }

/* Keywords Page */
.keywords-page { padding: 16px; }
.kn-section {
  background: #1A1925;
  border-radius: 12px;
  margin-bottom: 16px;
  overflow: hidden;
}
.kn-title {
  padding: 14px 16px;
  font-weight: 600;
  font-size: 14px;
  border-bottom: 1px solid #252336;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.kn-count { font-size: 12px; color: #888; font-weight: 400; }
.kn-list {
  padding: 12px 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.kn-tag {
  padding: 5px 10px;
  border-radius: 16px;
  font-size: 12px;
  background: #252336;
  color: #ccc;
}
.kn-tag.custom {
  background: rgba(108, 92, 231, 0.2);
  color: #A29BFE;
  position: relative;
  padding-right: 22px;
}
.kn-tag .remove-btn {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: #888;
  cursor: pointer;
}
.kn-add {
  padding: 12px 16px;
  border-top: 1px solid #252336;
  display: flex;
  gap: 8px;
}
.kn-add input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid #252336;
  background: #0F0E17;
  color: #F5F5F7;
  font-size: 13px;
}
.kn-add button {
  padding: 8px 16px;
  border-radius: 8px;
  background: #6C5CE7;
  color: white;
  border: none;
  font-size: 13px;
  font-weight: 500;
}

/* History Page */
.history-page { padding: 16px; }
.history-item {
  background: #1A1925;
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.history-item:active { background: #252336; }
.history-time { font-size: 14px; font-weight: 500; }
.history-count { font-size: 12px; color: #888; margin-top: 4px; }

/* Loading */
.loading { text-align: center; padding: 60px 20px; color: #888; font-size: 13px; }
.empty { text-align: center; padding: 60px 20px; color: #666; font-size: 13px; }
.empty .icon { font-size: 40px; margin-bottom: 12px; }

/* Refresh btn */
.refresh-btn {
  position: fixed;
  right: 16px;
  bottom: 80px;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #6C5CE7;
  color: white;
  border: none;
  font-size: 20px;
  box-shadow: 0 4px 16px rgba(108, 92, 231, 0.4);
  z-index: 90;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.refresh-btn:active { transform: scale(0.95); }
.refresh-btn.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.8);
  color: white;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* Page hide */
.page { display: none; }
.page.active { display: block; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🔥 热搜追踪</h1>
  <div class="subtitle">教育 · 认知 · 家庭 · 升学 · 艺术 · 美学</div>
  <div class="time" id="update-time">加载中...</div>
</div>

<!-- Tab Bar -->
<div class="tab-bar" id="domain-tabs">
  <div class="tab-chip active" data-domain="all">全部相关</div>
  <div class="tab-chip" data-domain="教育">教育</div>
  <div class="tab-chip" data-domain="认知">认知</div>
  <div class="tab-chip" data-domain="家庭">家庭</div>
  <div class="tab-chip" data-domain="升学">升学</div>
  <div class="tab-chip" data-domain="艺术">艺术</div>
  <div class="tab-chip" data-domain="美学">美学</div>
</div>

<!-- Platform Filter -->
<div class="platform-filter" id="platform-filter">
  <div class="platform-chip active" data-platform="all">全部平台</div>
</div>

<!-- Hot Search Page -->
<div class="page active" id="page-hotsearch">
  <div class="hot-list" id="hot-list">
    <div class="loading">加载中...</div>
  </div>
</div>

<!-- Keywords Page -->
<div class="page" id="page-keywords">
  <div class="keywords-page" id="keywords-content"></div>
</div>

<!-- History Page -->
<div class="page" id="page-history">
  <div class="history-page" id="history-list"></div>
</div>

<!-- Refresh Button -->
<button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()">🔄</button>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <div class="nav-item active" data-page="hotsearch">
    <div class="nav-icon">🔥</div><div>热搜</div>
  </div>
  <div class="nav-item" data-page="history">
    <div class="nav-icon">📅</div><div>历史</div>
  </div>
  <div class="nav-item" data-page="keywords">
    <div class="nav-icon">🏷️</div><div>关键词</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ 配置 ============
const PLATFORMS = [
  { key: 'weibo', name: '微博', color: '#E6162D' },
  { key: 'douyin', name: '抖音', color: '#000000' },
  { key: 'zhihu', name: '知乎', color: '#0066FF' },
  { key: 'baidu', name: '百度', color: '#2932E1' },
  { key: 'bilibili', name: 'B站', color: '#FB7299' }
];

const KW_STORAGE_KEY = 'hotsearch_keywords_v2';

let currentDomain = 'all';
let currentPlatform = 'all';
let currentTimestamp = null;

// ============ 工具函数 ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============ 关键词管理 ============
// 所有关键词都存在localStorage，可自由增删
function getAllKeywords() {
  try {
    const stored = JSON.parse(localStorage.getItem(KW_STORAGE_KEY) || 'null');
    if (stored) return stored;
  } catch(e) {}
  // 第一次使用，从默认关键词初始化
  const init = {};
  for (const [d, kws] of Object.entries(window.DEFAULT_KEYWORDS)) {
    init[d] = [...kws];
  }
  localStorage.setItem(KW_STORAGE_KEY, JSON.stringify(init));
  return init;
}
function saveAllKeywords(kw) {
  localStorage.setItem(KW_STORAGE_KEY, JSON.stringify(kw));
}
function addKeyword(domain, keyword) {
  const kw = getAllKeywords();
  if (!kw[domain]) kw[domain] = [];
  if (!kw[domain].includes(keyword)) kw[domain].push(keyword);
  saveAllKeywords(kw);
  return kw;
}
function removeKeyword(domain, keyword) {
  const kw = getAllKeywords();
  if (kw[domain]) {
    kw[domain] = kw[domain].filter(k => k !== keyword);
    saveAllKeywords(kw);
  }
  return kw;
}

// 排除词管理
const EXCLUDE_STORAGE_KEY = 'hotsearch_exclude_v2';
function getExcludeKeywords() {
  try {
    const stored = JSON.parse(localStorage.getItem(EXCLUDE_STORAGE_KEY) || 'null');
    if (stored) return stored;
  } catch(e) {}
  const init = [...window.EXCLUDE_KEYWORDS];
  localStorage.setItem(EXCLUDE_STORAGE_KEY, JSON.stringify(init));
  return init;
}
function saveExcludeKeywords(kw) {
  localStorage.setItem(EXCLUDE_STORAGE_KEY, JSON.stringify(kw));
}
function addExcludeKeyword(keyword) {
  const kw = getExcludeKeywords();
  if (!kw.includes(keyword)) kw.push(keyword);
  saveExcludeKeywords(kw);
  return kw;
}
function removeExcludeKeyword(keyword) {
  const kw = getExcludeKeywords();
  const newKw = kw.filter(k => k !== keyword);
  saveExcludeKeywords(newKw);
  return newKw;
}

// 分析话题：计算关联度和赛道
function analyzeTopic(title) {
  const domains = [];
  const matched = [];
  const allKws = getAllKeywords();
  const excludes = getExcludeKeywords();
  
  // 先检查排除词
  const excluded = excludes.some(kw => title.includes(kw));
  if (excluded) return { domains: [], matchedKeywords: [], relevance: 0, excluded: true };
  
  for (const [domain, keywords] of Object.entries(allKws)) {
    for (const kw of keywords) {
      if (title.includes(kw)) {
        if (!domains.includes(domain)) domains.push(domain);
        matched.push(kw);
      }
    }
  }
  
  return { domains, matchedKeywords: matched, relevance: matched.length, excluded: false };
}

// ============ 平台筛选渲染 ============
function renderPlatformFilter() {
  const container = document.getElementById('platform-filter');
  container.innerHTML = '<div class="platform-chip active" data-platform="all">全部平台</div>' +
    PLATFORMS.map(p => `<div class="platform-chip" data-platform="${p.name}">${p.name}</div>`).join('');
  container.querySelectorAll('.platform-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      container.querySelectorAll('.platform-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentPlatform = chip.dataset.platform;
      renderHotList();
    });
  });
}

// ============ 热搜列表渲染 ============
function getCurrentItems() {
  const data = window.HOTSEARCH_DATA || [];
  if (!data || data.length === 0) return { items: [], dateStr: '' };
  
  let record;
  if (currentTimestamp) {
    record = data.find(r => r.timestamp === currentTimestamp) || data[0];
  } else {
    record = data[0];
  }
  
  let items = (record.items || []).map(item => {
    // 如果没有预先计算关联度，前端计算
    if (item.relevance === undefined) {
      const analysis = analyzeTopic(item.title);
      return { ...item, ...analysis };
    }
    return item;
  });
  
  // 过滤掉排除的
  items = items.filter(item => !item.excluded);
  
  // 按关联度降序排序
  items.sort((a, b) => {
    if ((b.relevance || 0) !== (a.relevance || 0)) return (b.relevance || 0) - (a.relevance || 0);
    return (b.lastSeen || 0) - (a.lastSeen || 0);
  });
  
  return { items, dateStr: record.dateStr };
}

function renderHotList() {
  const list = document.getElementById('hot-list');
  const { items, dateStr } = getCurrentItems();
  
  if (items.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">📭</div><br>暂无数据</div>';
    document.getElementById('update-time').textContent = '暂无数据';
    return;
  }
  
  document.getElementById('update-time').textContent = '更新于 ' + dateStr;
  
  let filtered = items;
  
  // 按赛道筛选
  if (currentDomain !== 'all') {
    filtered = filtered.filter(item => item.domains && item.domains.includes(currentDomain));
  }
  
  // 按平台筛选
  if (currentPlatform !== 'all') {
    filtered = filtered.filter(item => item.platform === currentPlatform);
  }
  
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">🔍</div><br>没有匹配的热搜<br><span style="font-size:11px;">试试切换赛道或平台</span></div>';
    return;
  }
  
  list.innerHTML = filtered.map((item, i) => {
    const rankClass = i < 3 ? `top${i+1}` : '';
    const hasRelevance = item.relevance > 0;
    const domainTags = item.domains && item.domains.length > 0
      ? `<div class="hot-domains">${item.domains.map(d => `<span class="hot-domain-tag">${d}</span>`).join('')}</div>`
      : '';
    const relevanceBadge = hasRelevance
      ? `<span style="font-size:10px;color:${item.relevance >= 3 ? '#FFD700' : item.relevance >= 2 ? '#A29BFE' : '#888'}">${'●'.repeat(item.relevance)}</span>`
      : '';
    return `
      <a href="${item.url}" target="_blank" class="hot-item">
        <div class="hot-rank ${rankClass}">${i+1}</div>
        <div class="hot-content">
          <div class="hot-title">${escapeHtml(item.title)}</div>
          <div class="hot-meta">
            <span class="hot-platform" style="background:${item.color || '#666'}22;color:${item.color || '#ccc'}">${item.platform}</span>
            <span>${item.hot || ''}</span>
            ${relevanceBadge}
          </div>
          ${domainTags}
        </div>
      </a>
    `;
  }).join('');
}

// ============ 手动刷新 ============
function manualRefresh() {
  showToast('数据每2小时自动更新');
}

// ============ 历史记录 ============
function renderHistory() {
  const list = document.getElementById('history-list');
  const data = window.HOTSEARCH_DATA || [];
  
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="empty"><div class="icon">📅</div><br>暂无历史记录</div>';
    return;
  }
  
  list.innerHTML = data.map(item => `
    <div class="history-item" onclick="viewHistory(${item.timestamp})">
      <div>
        <div class="history-time">${escapeHtml(item.dateStr)}</div>
        <div class="history-count">${item.items ? item.items.length : 0} 条热搜</div>
      </div>
      <div style="color:#888;">›</div>
    </div>
  `).join('');
}

function viewHistory(timestamp) {
  currentTimestamp = timestamp;
  switchPage('hotsearch');
}

// ============ 关键词管理页面 ============
let kwCurrentTab = 'keywords'; // keywords / exclude

function renderKeywords() {
  const container = document.getElementById('keywords-content');
  const allKws = getAllKeywords();
  const excludes = getExcludeKeywords();
  const domains = Object.keys(allKws);
  
  if (kwCurrentTab === 'keywords') {
    container.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <div class="tab-btn active" onclick="switchKwTab('keywords')">🏷️ 关键词</div>
        <div class="tab-btn" onclick="switchKwTab('exclude')">🚫 排除词</div>
      </div>
      <div class="kn-section">
        <div class="kn-title">
          <span>📂 赛道分类</span>
          <span class="kn-count">${domains.length} 个赛道</span>
        </div>
        <div class="kn-list">
          ${domains.map(d => `<span class="kn-tag custom">${escapeHtml(d)}<span class="remove-btn" onclick="doRemoveDomain('${escapeHtml(d)}')">×</span></span>`).join('')}
        </div>
        <div class="kn-add">
          <input type="text" id="add-domain" placeholder="添加新赛道（如：留学规划）...">
          <button onclick="doAddDomain()">添加赛道</button>
        </div>
      </div>
      <div style="height:1px;background:#252336;margin:16px 0;"></div>
      ${domains.map(domain => {
        const kws = allKws[domain] || [];
        return `
          <div class="kn-section">
            <div class="kn-title">
              <span class="domain-name" ondblclick="doRenameDomain('${escapeHtml(domain)}')" title="双击重命名">${escapeHtml(domain)}</span>
              <span class="kn-count">${kws.length} 个关键词</span>
            </div>
            <div class="kn-list">
              ${kws.map(k => `<span class="kn-tag custom">${escapeHtml(k)}<span class="remove-btn" onclick="doRemoveKeyword('${escapeHtml(domain)}', '${escapeHtml(k)}')">×</span></span>`).join('')}
            </div>
            <div class="kn-add">
              <input type="text" id="add-kw-${domain}" placeholder="添加关键词...">
              <button onclick="doAddKeyword('${escapeHtml(domain)}')">添加</button>
            </div>
          </div>
        `;
      }).join('')}
      <div style="font-size:11px;color:#888;margin-top:12px;padding:0 4px;">
        💡 双击赛道名可以重命名。赛道用于分类热搜，关键词越精准匹配越准确。
      </div>
    `;
  } else {
    container.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:12px;">
        <div class="tab-btn" onclick="switchKwTab('keywords')">🏷️ 关键词</div>
        <div class="tab-btn active" onclick="switchKwTab('exclude')">🚫 排除词</div>
      </div>
      <div class="kn-section">
        <div class="kn-title">
          <span>排除词（过滤不想要的内容）</span>
          <span class="kn-count">${excludes.length} 个</span>
        </div>
        <div class="kn-list">
          ${excludes.map(k => `<span class="kn-tag custom">${escapeHtml(k)}<span class="remove-btn" onclick="doRemoveExclude('${escapeHtml(k)}')">×</span></span>`).join('')}
        </div>
        <div class="kn-add">
          <input type="text" id="add-exclude" placeholder="添加排除词...">
          <button onclick="doAddExclude()">添加</button>
        </div>
      </div>
      <div style="font-size:11px;color:#888;margin-top:8px;padding:0 4px;">
        💡 排除词用于过滤不相关的热搜。比如加"搞笑"，带搞笑的热搜就不会出现了。
      </div>
    `;
  }
}

function switchKwTab(tab) {
  kwCurrentTab = tab;
  renderKeywords();
}

function doAddKeyword(domain) {
  const input = document.getElementById(`add-kw-${domain}`);
  const keyword = input.value.trim();
  if (!keyword) return;
  addKeyword(domain, keyword);
  input.value = '';
  showToast('已添加');
  renderKeywords();
  renderHotList();
}

function doRemoveKeyword(domain, keyword) {
  if (!confirm(`删除关键词"${keyword}"？`)) return;
  removeKeyword(domain, keyword);
  showToast('已删除');
  renderKeywords();
  renderHotList();
}

function doAddExclude() {
  const input = document.getElementById('add-exclude');
  const keyword = input.value.trim();
  if (!keyword) return;
  addExcludeKeyword(keyword);
  input.value = '';
  showToast('已添加');
  renderKeywords();
  renderHotList();
}

function doRemoveExclude(keyword) {
  if (!confirm(`删除排除词"${keyword}"？`)) return;
  removeExcludeKeyword(keyword);
  showToast('已删除');
  renderKeywords();
  renderHotList();
}

// ============ 赛道管理 ============
function doAddDomain() {
  const input = document.getElementById('add-domain');
  const domain = input.value.trim();
  if (!domain) return;
  const kw = getAllKeywords();
  if (kw[domain]) {
    showToast('赛道已存在');
    return;
  }
  kw[domain] = [];
  saveAllKeywords(kw);
  input.value = '';
  showToast('赛道已添加');
  renderKeywords();
  updateDomainTabs();
}

function doRemoveDomain(domain) {
  if (!confirm(`确定删除赛道"${domain}"？\n该赛道下的所有关键词都会被删除。`)) return;
  const kw = getAllKeywords();
  delete kw[domain];
  saveAllKeywords(kw);
  showToast('赛道已删除');
  renderKeywords();
  updateDomainTabs();
  // 如果当前选中的是被删除的赛道，切回全部
  if (currentDomain === domain) {
    currentDomain = 'all';
    document.querySelectorAll('#domain-tabs .tab-chip').forEach(c => c.classList.toggle('active', c.dataset.domain === 'all'));
  }
  renderHotList();
}

function doRenameDomain(domain) {
  const newName = prompt(`将"${domain}"重命名为：`, domain);
  if (!newName || newName === domain) return;
  const kw = getAllKeywords();
  if (kw[newName]) {
    showToast('赛道名已存在');
    return;
  }
  kw[newName] = kw[domain];
  delete kw[domain];
  saveAllKeywords(kw);
  showToast('已重命名');
  renderKeywords();
  updateDomainTabs();
  if (currentDomain === domain) currentDomain = newName;
  renderHotList();
}

// 更新顶部赛道Tab
function updateDomainTabs() {
  const allKws = getAllKeywords();
  const domains = Object.keys(allKws);
  const tabsContainer = document.getElementById('domain-tabs');
  if (!tabsContainer) return;
  tabsContainer.innerHTML = `
    <div class="tab-chip ${currentDomain === 'all' ? 'active' : ''}" data-domain="all">全部</div>
    ${domains.map(d => `<div class="tab-chip ${currentDomain === d ? 'active' : ''}" data-domain="${escapeHtml(d)}">${escapeHtml(d)}</div>`).join('')}
  `;
  // 重新绑定点击事件
  tabsContainer.querySelectorAll('.tab-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      tabsContainer.querySelectorAll('.tab-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentDomain = chip.dataset.domain;
      currentTimestamp = null;
      renderHotList();
    });
  });
}

// ============ 页面切换 ============
function switchPage(page) {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.page === page);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`page-${page}`).classList.add('active');
  
  if (page === 'hotsearch') renderHotList();
  if (page === 'history') renderHistory();
  if (page === 'keywords') renderKeywords();
}

// 底部导航
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => switchPage(item.dataset.page));
});

// 赛道Tab点击
document.querySelectorAll('#domain-tabs .tab-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#domain-tabs .tab-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentDomain = chip.dataset.domain;
    currentTimestamp = null;
    renderHotList();
  });
});
